[package]
name = "yadbe"
version = "0.1.0"
description = "yadbe, a fast cross-platform SQL database explorer"
edition = "2024"
license = "GPL-3.0-or-later"
# specta 2.0.0-rc.25 needs 1.93 (debug_closure_helpers), Tauri 2.12 needs 1.90.
rust-version = "1.93"
default-run = "yadbe"
publish = false

[lib]
name = "yadbe_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# An example, not a `[[bin]]`: the bundler ships every binary target of the package.
[[example]]
name = "export-bindings"
path = "examples/export_bindings.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
specta = { version = "=2.0.0-rc.25" }
specta-typescript = "0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "net", "macros"] }
# Already in the lockfile through Tauri: drains the row stream of tokio-postgres.
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio-postgres = "0.7.18"
# Same crate family as tokio-postgres: binary decoding of arrays and network types.
postgres-protocol = "0.6"
# TLS through rustls with the `ring` provider (aws-lc-rs needs cmake and NASM on Windows).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
# OS trust store for `verify-full` when no custom CA is given.
rustls-native-certs = "0.8"
rusqlite = { version = "0.41", features = ["bundled"] }
keyring = "4.2"
zeroize = "1"
# Already in the lockfile through Tauri.
uuid = { version = "1", features = ["v4"] }
url = "2"

[dev-dependencies]
tempfile = "3"
