[package]
name = "yadbe"
version = "0.1.0"
description = "yadbe, a fast cross-platform SQL database explorer"
edition = "2024"
license = "GPL-3.0-or-later"
# specta 2.0.0-rc.25 needs 1.93 (debug_closure_helpers), Tauri 2.12 needs 1.90.
rust-version = "1.93"
default-run = "yadbe"
publish = false

[lib]
name = "yadbe_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# An example, not a `[[bin]]`: the bundler ships every binary target of the package.
[[example]]
name = "export-bindings"
path = "examples/export_bindings.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# `rc`: the cached completion catalog is returned as an `Arc`, without a deep copy.
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
thiserror = "2"
specta = { version = "=2.0.0-rc.25" }
specta-typescript = "0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "net", "macros"] }
# Already in the lockfile through Tauri: drains the row stream of tokio-postgres.
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio-postgres = "0.7.18"
# Same crate family as tokio-postgres: binary decoding of arrays and network types.
postgres-protocol = "0.6"
# Iterator type of postgres-protocol's array decoding (already a dependency of it).
fallible-iterator = "0.2"
# TLS through rustls with the `ring` provider (aws-lc-rs needs cmake and NASM on Windows).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
# OS trust store for `verify-full` when no custom CA is given.
rustls-native-certs = "0.8"
# SQL Server (TDS). Vendored and patched (vendor/tiberius/PATCHES.md): the published API
# drops PRINT / RAISERROR messages, per-statement row counts and every error but the first,
# cannot send a TDS Attention while a result streams, decodes money as f64 and pulls
# aws-lc-rs for TLS.
tiberius = { path = "vendor/tiberius", default-features = false, features = ["tds80", "rustls", "sql-browser-tokio"] }
# `compat`: tiberius speaks futures-io; tokio's TcpStream goes through this adapter.
tokio-util = { version = "0.7", features = ["compat"] }
# MySQL / MariaDB. No default features: TLS through the rustls + ring stack already used
# above (no OpenSSL, no aws-lc-rs), pure-Rust zlib, none of mysql_common's optional value
# conversions (chrono, time, bigdecimal…): yadbe decodes the wire values itself.
mysql_async = { version = "0.37", default-features = false, features = ["minimal-rust", "rustls-tls", "ring", "tls12"] }
# `column_metadata`: where result columns come from, for editable results (F-087).
rusqlite = { version = "0.41", features = ["bundled", "column_decltype", "column_metadata"] }
keyring = "4.2"
zeroize = "1"
# Already in the lockfile through Tauri.
uuid = { version = "1", features = ["v4"] }
url = "2"
# Native open dialog for SQLite files (SPEC §9: file access only through explicit dialogs).
tauri-plugin-dialog = "2"
# SSH tunnels (F-010): pure Rust, `ring` + RustCrypto like the TLS stack (no aws-lc-rs, no
# OpenSSL); `rsa` for RSA keys (rsa-sha2-256/512), no zlib compression. Vendored and patched
# (vendor/russh/PATCHES.md): the published crate refills a channel's window as soon as data
# arrives, so one connection that stops reading (a result paused at its cap) stalls every
# connection of the SSH session.
russh = { path = "vendor/russh", default-features = false, features = ["ring", "rsa"] }
# Excel export (F-066): a worksheet is a deflated ZIP entry streamed while the rows arrive.
# Pure Rust (miniz_oxide) and a few hundred lines of ours, instead of rust_xlsxwriter (a
# dependency tree of its own, written for building a workbook in memory or on disk).
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
crc32fast = "1"
# Encrypted PKCS#8 client keys (F-009), `openssl pkcs8 -topk8` / ssh-keygen style. Already in the
# lockfile with the same features through russh (no new crate): PBES2 with PBKDF2 / scrypt, AES-CBC.
pkcs8 = { version = "0.11", default-features = false, features = ["encryption", "pem", "std"] }
# SEC1 EC keys read to wrap them as PKCS#8 (M4-4: the MongoDB client key is handed to the driver
# re-encrypted, see db/tls_identity.rs). Already in the lockfile through elliptic-curve.
sec1 = { version = "0.8", default-features = false, features = ["der"] }
# MongoDB (M4-2): the official driver, async on tokio, TLS through rustls + ring like the rest
# (no OpenSSL, no aws-lc-rs); `dns-resolver` for `mongodb+srv://`; `cert-key-password` (M4-4,
# adds `pem`, 1 small crate; `pkcs8` is already here) so that the client key the driver reads
# from a file is encrypted under a one-time password kept in memory, never written in clear.
# `bson` 3 is the crate the driver uses (same version, no second copy), with `serde_json-1` for
# Extended JSON.
mongodb = { version = "3.10", default-features = false, features = ["compat-3-3-0", "bson-3", "rustls-tls", "dns-resolver", "cert-key-password"] }
bson = { version = "3.1", features = ["serde_json-1"] }
# Redis / Valkey (M4-5): RESP2 / RESP3 codec, multiplexed async connection on tokio. No TLS,
# cluster, sentinel, script or value-conversion features: yadbe dials TCP (and the SSH tunnel)
# itself, wraps TLS with the rustls config the other drivers use, and decodes replies itself.
redis = { version = "1.8", default-features = false, features = ["tokio-comp"] }
# Key and value bytes that are not UTF-8 cross the IPC as base64 (key-value family).
base64 = "0.22"
# mongosh scripts (M4-3): QuickJS (quickjs-ng, C compiled by `cc`, MIT) through its Rust
# bindings. A complete modern JavaScript with a memory limit, a stack limit and an interrupt
# hook, in about 1 MB; no std/os modules, no module loader (default features only). boa
# (pure Rust) was the fallback: larger, slower, no stack limit of its own.
rquickjs = "0.14"
# Elasticsearch / OpenSearch (M4-7): HTTP/1.1 + JSON, no client crate. hyper and hyper-util's
# pooled client are already in the lockfile (reqwest, through Tauri), with every crate these
# features need. reqwest itself was ruled out: its rustls features pull aws-lc-rs or
# rustls-platform-verifier + hyper-rustls (new crates) and it dials by itself, while yadbe's own
# connector reuses the TCP dial (SSH tunnel) and the rustls config of the other drivers.
hyper = { version = "1", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["client-legacy", "http1", "tokio"] }
http-body-util = "0.1"
http = "1"
bytes = "1"
tower-service = "0.3"
# Self-update of the release installers (opt-in update check, SPEC §10), as in yaggui: the
# official plugin downloads the bundle, checks its minisign signature and installs it. Used
# from Rust only (no updater permission for the webview). `rustls-tls` only: ring, like the
# drivers (no aws-lc-rs, no OpenSSL); no `zip` (Tauri 2 updater bundles are not zipped), no
# `system-proxy`. Writing our own would mean re-implementing signature checks and the
# per-OS install steps (MSI / NSIS hand-off, .app swap, AppImage replace).
tauri-plugin-updater = { version = "2.14", default-features = false, features = ["rustls-tls"] }
# Already in the lockfile through the updater: the update check reads the manifest and
# downloads a `.deb` / `.rpm` with the same client (no second HTTP stack).
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
# Already in the lockfile through Tauri: version comparison of the update check.
semver = "1"
# Already in the lockfile through Tauri: checks a downloaded `.deb` / `.rpm` against the
# release's SHA256SUMS.txt before the user hands it to their package manager.
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
