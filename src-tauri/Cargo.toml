[package]
name = "yadbe"
version = "0.1.0"
description = "yadbe, a fast cross-platform SQL database explorer"
edition = "2024"
license = "GPL-3.0-or-later"
# specta 2.0.0-rc.25 needs 1.93 (debug_closure_helpers), Tauri 2.12 needs 1.90.
rust-version = "1.93"
default-run = "yadbe"
publish = false

[lib]
name = "yadbe_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# An example, not a `[[bin]]`: the bundler ships every binary target of the package.
[[example]]
name = "export-bindings"
path = "examples/export_bindings.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# `rc`: the cached completion catalog is returned as an `Arc`, without a deep copy.
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
thiserror = "2"
specta = { version = "=2.0.0-rc.25" }
specta-typescript = "0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "net", "macros"] }
# Already in the lockfile through Tauri: drains the row stream of tokio-postgres.
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio-postgres = "0.7.18"
# Same crate family as tokio-postgres: binary decoding of arrays and network types.
postgres-protocol = "0.6"
# Iterator type of postgres-protocol's array decoding (already a dependency of it).
fallible-iterator = "0.2"
# TLS through rustls with the `ring` provider (aws-lc-rs needs cmake and NASM on Windows).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
# OS trust store for `verify-full` when no custom CA is given.
rustls-native-certs = "0.8"
# SQL Server (TDS). Vendored and patched (vendor/tiberius/PATCHES.md): the published API
# drops PRINT / RAISERROR messages, per-statement row counts and every error but the first,
# cannot send a TDS Attention while a result streams, decodes money as f64 and pulls
# aws-lc-rs for TLS.
tiberius = { path = "vendor/tiberius", default-features = false, features = ["tds80", "rustls", "sql-browser-tokio"] }
# `compat`: tiberius speaks futures-io; tokio's TcpStream goes through this adapter.
tokio-util = { version = "0.7", features = ["compat"] }
# MySQL / MariaDB. No default features: TLS through the rustls + ring stack already used
# above (no OpenSSL, no aws-lc-rs), pure-Rust zlib, none of mysql_common's optional value
# conversions (chrono, time, bigdecimal…): yadbe decodes the wire values itself.
mysql_async = { version = "0.37", default-features = false, features = ["minimal-rust", "rustls-tls", "ring", "tls12"] }
# `column_metadata`: where result columns come from, for editable results (F-087).
rusqlite = { version = "0.41", features = ["bundled", "column_decltype", "column_metadata"] }
keyring = "4.2"
zeroize = "1"
# Already in the lockfile through Tauri.
uuid = { version = "1", features = ["v4"] }
url = "2"
# Native open dialog for SQLite files (SPEC §9: file access only through explicit dialogs).
tauri-plugin-dialog = "2"
# SSH tunnels (F-010): pure Rust, `ring` + RustCrypto like the TLS stack (no aws-lc-rs, no
# OpenSSL); `rsa` for RSA keys (rsa-sha2-256/512), no zlib compression. Vendored and patched
# (vendor/russh/PATCHES.md): the published crate refills a channel's window as soon as data
# arrives, so one connection that stops reading (a result paused at its cap) stalls every
# connection of the SSH session.
russh = { path = "vendor/russh", default-features = false, features = ["ring", "rsa"] }
# Excel export (F-066): a worksheet is a deflated ZIP entry streamed while the rows arrive.
# Pure Rust (miniz_oxide) and a few hundred lines of ours, instead of rust_xlsxwriter (a
# dependency tree of its own, written for building a workbook in memory or on disk).
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
crc32fast = "1"
# Encrypted PKCS#8 client keys (F-009), `openssl pkcs8 -topk8` / ssh-keygen style. Already in the
# lockfile with the same features through russh (no new crate): PBES2 with PBKDF2 / scrypt, AES-CBC.
pkcs8 = { version = "0.11", default-features = false, features = ["encryption", "pem", "std"] }
# Redis / Valkey (M4-5): RESP2 / RESP3 codec, multiplexed async connection on tokio. No TLS,
# cluster, sentinel, script or value-conversion features: yadbe dials TCP (and the SSH tunnel)
# itself, wraps TLS with the rustls config the other drivers use, and decodes replies itself.
redis = { version = "1.8", default-features = false, features = ["tokio-comp"] }
# Key and value bytes that are not UTF-8 cross the IPC as base64 (key-value family).
base64 = "0.22"

[dev-dependencies]
tempfile = "3"
