# SQL Server settings for dev/compose.yml: TLS with the throwaway `localhost` certificate of
# dev/tls-certs.sh, so YADBE_TEST_MSSQL_CA can check a verified connection.
[network]
tlscert = /var/opt/mssql/certs/server.crt
tlskey = /var/opt/mssql/certs/server.key
tlsprotocols = 1.2
forceencryption = 0
