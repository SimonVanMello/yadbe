# Database engines for the integration tests (SPEC §10). Start with:
#   dev/tls-certs.sh                      # once: CA + server certificate in dev/certs/
#   docker compose -f dev/compose.yml up -d
# Then, from src-tauri/:
#   export YADBE_TEST_PG_URL=postgres://yadbe:yadbe-test-pw@localhost:55432/yadbe_test
#   export YADBE_TEST_PG_CA=../dev/certs/ca.crt
#   export YADBE_TEST_MSSQL_URL='sqlserver://localhost:51433;database=master;user=sa;password=Yadbe-test-pw1;trustServerCertificate=true'
#   export YADBE_TEST_MSSQL_CA=../dev/certs/ca.crt
#   export YADBE_TEST_MYSQL_URL=mysql://yadbe:yadbe-test-pw@localhost:53306/yadbe_test
#   export YADBE_TEST_MYSQL_CA=../dev/certs/ca.crt
#   export YADBE_TEST_MONGO_URL=mongodb://localhost:57017/?replicaSet=rs0
#   export YADBE_TEST_MONGO_STANDALONE_URL=mongodb://yadbe:yadbe-test-pw@localhost:57018/?authSource=admin
#   export YADBE_TEST_MONGO_CA=../dev/certs/ca.crt
#   export YADBE_TEST_REDIS_URL=redis://yadbe:yadbe-test-pw@localhost:56379/0
#   export YADBE_TEST_REDIS_TLS_URL=rediss://yadbe:yadbe-test-pw@localhost:56380/0
#   export YADBE_TEST_REDIS_CA=../dev/certs/ca.crt
#   export YADBE_TEST_VALKEY_URL=redis://yadbe:yadbe-test-pw@localhost:56381/0
# The search engines (about 1 GB of RAM each) start on demand:
#   docker compose -f dev/compose.yml up -d elasticsearch opensearch
#   export YADBE_TEST_ES_URL=https://elastic:yadbe-test-pw@localhost:59200
#   export YADBE_TEST_ES_CA=../dev/certs/ca.crt
#   export YADBE_TEST_OPENSEARCH_URL=http://localhost:59201
#   cargo test
# Ports are offset from the defaults so a local server keeps its own. Throwaway
# credentials: never reuse them.
name: yadbe-test-engines

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: yadbe
      POSTGRES_PASSWORD: yadbe-test-pw
      POSTGRES_DB: yadbe_test
    ports:
      - '55432:5432'
    volumes:
      - ./certs/server.crt:/certs/server.crt:ro
      - ./certs/server.key:/certs/server.key.src:ro
    # The server refuses a key it does not own: copy it with the right owner first.
    entrypoint:
      - bash
      - -c
      - >-
        install -o postgres -g postgres -m 600 /certs/server.key.src /tmp/server.key &&
        exec docker-entrypoint.sh postgres -c ssl=on
        -c ssl_cert_file=/certs/server.crt -c ssl_key_file=/tmp/server.key
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U yadbe -d yadbe_test']
      interval: 2s
      retries: 30

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    # Root, so the server reads the key dev/tls-certs.sh keeps private to its owner.
    user: root
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_SA_PASSWORD: Yadbe-test-pw1
    ports:
      - '51433:1433'
    volumes:
      - ./certs/server.crt:/var/opt/mssql/certs/server.crt:ro
      - ./certs/server.key:/var/opt/mssql/certs/server.key:ro
      - ./mssql.conf:/var/opt/mssql/mssql.conf:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Yadbe-test-pw1 -C -Q 'SELECT 1'",
        ]
      interval: 5s
      retries: 30

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: yadbe-test-root
      MYSQL_USER: yadbe
      MYSQL_PASSWORD: yadbe-test-pw
      MYSQL_DATABASE: yadbe_test
    ports:
      - '53306:3306'
    volumes:
      - ./certs/ca.crt:/certs/ca.crt:ro
      - ./certs/server.crt:/certs/server.crt:ro
      - ./certs/server.key:/certs/server.key.src:ro
      - ./mysql-init.sql:/docker-entrypoint-initdb.d/yadbe-init.sql:ro
    # Serves the dev CA's `localhost` certificate (the TLS tests verify it); the key is
    # copied first so the server user can read it.
    entrypoint:
      - bash
      - -c
      - >-
        install -o mysql -g mysql -m 600 /certs/server.key.src /tmp/server.key &&
        exec docker-entrypoint.sh mysqld --ssl-ca=/certs/ca.crt
        --ssl-cert=/certs/server.crt --ssl-key=/tmp/server.key --disable-log-bin
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-uyadbe', '-pyadbe-test-pw']
      interval: 2s
      retries: 30

  # MongoDB as a single-node replica set (transactions, topology discovery). mongod listens on
  # 57017 inside the container too, so the member address it announces (localhost:57017)
  # is the one the host reaches. The healthcheck initiates the set once.
  mongo:
    image: mongo:7.0
    command: ['mongod', '--replSet', 'rs0', '--bind_ip_all', '--port', '57017']
    ports:
      - '57017:57017'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mongosh --port 57017 --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate({ _id: ''rs0'', members: [{ _id: 0, host: ''localhost:57017'' }] }).ok }" | grep -q 1',
        ]
      interval: 2s
      retries: 30

  # MongoDB standalone (no transactions), with authentication and TLS allowed (the dev CA's
  # `localhost` certificate; plain connections still work).
  mongo-standalone:
    image: mongo:7.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: yadbe
      MONGO_INITDB_ROOT_PASSWORD: yadbe-test-pw
    ports:
      - '57018:27017'
    volumes:
      - ./certs/server.crt:/certs/server.crt:ro
      - ./certs/server.key:/certs/server.key.src:ro
      - ./certs/ca.crt:/certs/ca.crt:ro
    # mongod reads the certificate and its key from one file, owned by its user.
    entrypoint:
      - bash
      - -c
      - >-
        cat /certs/server.crt /certs/server.key.src > /tmp/server.pem &&
        chown mongodb /tmp/server.pem && chmod 600 /tmp/server.pem &&
        exec docker-entrypoint.sh mongod --bind_ip_all --tlsMode allowTLS
        --tlsCertificateKeyFile /tmp/server.pem --tlsCAFile /certs/ca.crt
        --tlsAllowConnectionsWithoutCertificates
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "mongosh --quiet -u yadbe -p yadbe-test-pw --authenticationDatabase admin --eval 'db.runCommand({ ping: 1 }).ok' | grep -q 1",
        ]
      interval: 2s
      retries: 30

  # Redis 8 (RedisJSON built in) with an ACL user, plain on 56379 and TLS (dev CA) on 56380.
  # Only the key-value tests use it: `up -d redis valkey`.
  redis:
    image: redis:8.2
    ports:
      - '56379:6379'
      - '56380:6380'
    volumes:
      - ./certs/ca.crt:/certs/ca.crt:ro
      - ./certs/server.crt:/certs/server.crt:ro
      - ./certs/server.key:/certs/server.key.src:ro
    entrypoint:
      - bash
      - -c
      - >-
        install -o redis -g redis -m 600 /certs/server.key.src /tmp/server.key &&
        exec docker-entrypoint.sh redis-server --save '' --appendonly no
        --requirepass yadbe-test-pw --user yadbe on '>yadbe-test-pw' '~*' '&*' '+@all'
        --tls-port 6380 --tls-cert-file /certs/server.crt --tls-key-file /tmp/server.key
        --tls-ca-cert-file /certs/ca.crt --tls-auth-clients optional
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', 'yadbe-test-pw', '--no-auth-warning', 'ping']
      interval: 2s
      retries: 30

  # Valkey (no JSON module), same ACL user: the key-value suite runs on both servers.
  valkey:
    image: valkey/valkey:8.1
    ports:
      - '56381:6379'
    command:
      - valkey-server
      - --save
      - ''
      - --appendonly
      - 'no'
      - --requirepass
      - yadbe-test-pw
      - --user
      - yadbe
      - 'on'
      - '>yadbe-test-pw'
      - '~*'
      - '&*'
      - '+@all'
    healthcheck:
      test: ['CMD', 'valkey-cli', '-a', 'yadbe-test-pw', '--no-auth-warning', 'ping']
      interval: 2s
      retries: 30

  # Elasticsearch single node, security on: HTTPS with the dev CA's certificate, the
  # `elastic` superuser with a throwaway password, heap capped at 512 MB. About 1 GB of RAM:
  # started on demand (`up -d elasticsearch`, the `search` profile). The disk watermarks are
  # off so that a full test disk does not turn the indices read-only.
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.1.0
    profiles: [search]
    user: root
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      ELASTIC_PASSWORD: yadbe-test-pw
      xpack.security.enabled: 'true'
      xpack.security.http.ssl.enabled: 'true'
      xpack.security.http.ssl.key: certs/server.key
      xpack.security.http.ssl.certificate: certs/server.crt
      xpack.security.http.ssl.certificate_authorities: certs/ca.crt
      xpack.security.transport.ssl.enabled: 'false'
      xpack.ml.enabled: 'false'
      ingest.geoip.downloader.enabled: 'false'
      cluster.routing.allocation.disk.threshold_enabled: 'false'
    ports:
      - '59200:9200'
    volumes:
      - ./certs/ca.crt:/certs/ca.crt:ro
      - ./certs/server.crt:/certs/server.crt:ro
      - ./certs/server.key:/certs/server.key.src:ro
    # Elasticsearch refuses to run as root and reads only its config folder: copy the
    # certificates there with its owner, then start it as that user.
    entrypoint:
      - bash
      - -c
      - >-
        mkdir -p /usr/share/elasticsearch/config/certs &&
        install -o 1000 -g 0 -m 600 /certs/server.key.src /usr/share/elasticsearch/config/certs/server.key &&
        install -o 1000 -g 0 -m 644 /certs/server.crt /certs/ca.crt /usr/share/elasticsearch/config/certs/ &&
        exec chroot --userspec=1000:0 / env -C /usr/share/elasticsearch HOME=/usr/share/elasticsearch
        /usr/local/bin/docker-entrypoint.sh eswrapper
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS --cacert /certs/ca.crt -u elastic:yadbe-test-pw https://localhost:9200/_cluster/health
      interval: 5s
      retries: 60

  # OpenSearch single node, security plugin off (plain HTTP): the search suite runs where
  # its API equals Elasticsearch's. Same memory cap, same profile.
  opensearch:
    image: public.ecr.aws/opensearchproject/opensearch:2.19.1
    profiles: [search]
    environment:
      discovery.type: single-node
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
      DISABLE_SECURITY_PLUGIN: 'true'
      DISABLE_INSTALL_DEMO_CONFIG: 'true'
      cluster.routing.allocation.disk.threshold_enabled: 'false'
    ports:
      - '59201:9200'
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:9200/_cluster/health']
      interval: 5s
      retries: 60
